name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Test in release mode
        run: make test-release

      - name: Check the documentation
        run: make doc

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install "$(make -s msrv-version)" --profile minimal

      - name: Check the oldest supported Rust version
        run: make msrv

  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install nightly --profile minimal --component miri,rust-src

      - name: Test under Miri
        run: make miri

      - name: Test under Miri on a 32-bit target
        run: make miri-32
