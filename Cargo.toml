[package]
name = "rust-forth-vm"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"
publish = false

[[bin]]
name = "forth-vm"
path = "src/main.rs"

# The `forth-vm` prompt edits lines with `rustyline`. Library users can turn that off with
# `default-features = false`, which leaves the library with no dependencies. Versions after 17
# need a newer Rust than `rust-version`.
[features]
default = ["readline"]
readline = ["dep:rustyline"]

[dependencies]
rustyline = { version = "17", default-features = false, features = ["with-file-history"], optional = true }

# Runs its unit tests with `cargo test`, which checks that every workload still works.
[[example]]
name = "perf"
path = "examples/perf/main.rs"
test = true

# What `make perf` measures: the settings of `release`, which users get, plus line tables so that
# a profile can name source lines. These don't change the generated code.
[profile.perf]
inherits = "release"
debug = "line-tables-only"

# `make clippy` and `make doc` deny warnings, so undocumented code fails CI.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
missing_docs_in_private_items = "warn"
missing_errors_doc = "warn"
